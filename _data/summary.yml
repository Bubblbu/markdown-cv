        Data scientist, researcher, and community organizer with over a decade of experience building sustainable data systems and research infrastructure. Skilled in collecting, transforming, analyzing, and communicating complex data with a focus on clarity, transparency, and reproducibility. Experienced collaborator who bridges technical and human contexts translating analytics into insight, and insight into collective action. Brings a strong record of scholarly publication and data stewardship, now dedicated to applying these skills toward equitable, affordable housing and evidence-based public service.
